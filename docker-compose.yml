# Déploiement MoMoGuard sur Dokploy (Compose) ou en local.
# Les variables viennent de l'onglet Environment de Dokploy (.env généré).
services:
  momoguard:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      # Persistance SQLite (admin, 2FA, alertes, utilisateurs) entre redéploiements
      - momoguard_data:/app/data
    environment:
      - MOMOGUARD_DATA_DIR=/app/data

volumes:
  momoguard_data:
